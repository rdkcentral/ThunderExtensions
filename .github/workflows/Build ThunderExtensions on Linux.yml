name: Build ThunderExtensions on Linux

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  Thunder:
    uses: rdkcentral/Thunder/.github/workflows/Linux build template.yml@master

  ThunderExtensions:
    needs: Thunder
    uses: ./.github/workflows/Linux build template.yml
